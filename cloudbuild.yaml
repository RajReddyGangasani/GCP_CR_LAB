steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/gcp-cloud-run-lab/gcp-cr-lab/gcp-cr-lab:$SHORT_SHA'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/gcp-cloud-run-lab/gcp-cr-lab/gcp-cr-lab:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
